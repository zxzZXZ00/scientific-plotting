style: ../styles/mist-blue-rose.mplstyle
defaults:
  template: line
  palette: user:mist-blue-rose
  figure:
    width_mm: 60
    height_mm: 50
  labels:
    x: X
    y: Y
  appearance:
    linewidth: 0.8
    marker: s
    markers:
    - s
    - ^
    markerfacecolor: none
    marker_threshold: 15
    markersize: 3.2
    labelsize: 10
    tick_labelsize: 7
    max_major_ticks: 5
    full_frame: true
    band_alpha: 0.18
    legend_location: upper right
  output:
    formats:
    - png
    - svg
    - pdf
    dpi: 240
    transparent: false
layouts:
  reviewed-reference:
    implementation: archived-reference-reconstruction
    archive: ../examples/mist-blue-rose/
    script: reproduce.py
    description: a-f two-column three-row electrochemistry panels
    data_status: PDF-geometry-not-original-numerical-data
    arbitrary_csv_supported: false
status: user-approved
approved_on: '2026-10-15'
applications:
  recommended:
  - electrochemistry
  source:
    file: s41557-026-02243-1.pdf
    page: 3
    figure: 2
    doi: 10.1038/s41557-026-02243-1
  reference_error_definition: 'Panels b/d: mean ± SD, n=3 independent experiments;
    not inferred for new data.'
  cross_domain_borrowing: true
